name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cxx }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cxx: [g++, clang++]
        build_type: [Release]
        exclude:
          # MSVC jobs use cl below instead.
          - os: windows-latest
            cxx: g++
          - os: windows-latest
            cxx: clang++
        include:
          - os: windows-latest
            cxx: cl
            build_type: Release
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPOWER_ENGINE_BUILD_TESTS=ON
        env:
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j4
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: ubuntu / ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DPOWER_ENGINE_BUILD_TESTS=ON
          -DPOWER_ENGINE_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build-san -j4
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1

  ninja:
    name: ubuntu / Ninja generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -B build-ninja -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOWER_ENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ninja
      - name: Test
        run: ctest --test-dir build-ninja --output-on-failure

  install-smoke:
    name: ubuntu / install + find_package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen (system package for the consumer path)
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Build + install
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release &&
          cmake --build build -j4 &&
          cmake --install build --prefix install
      - name: Consumer via find_package
        run: >
          cmake -B smoke-build -S packaging/smoke
          -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/install &&
          cmake --build smoke-build &&
          ./smoke-build/consumer

  cross-validate:
    name: ubuntu / ngspice cross-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen + ngspice + Python
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev ngspice python3
      - name: Build demos
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release &&
          cmake --build build -j4 --target netlist_buck_demo vienna_demo
      - name: Run xval (fails on bound violation)
        run: python3 power_engine/xval/xval.py --build-dir build

  fuzz-corpus:
    name: ubuntu-clang / fuzz corpus (ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Configure (Clang + ASan + fuzz target only)
        run: >
          cmake -B build-fuzz -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DPOWER_ENGINE_BUILD_FUZZ=ON
          -DPOWER_ENGINE_SANITIZE=address
          -DPOWER_ENGINE_BUILD_TESTS=OFF
          -DPOWER_ENGINE_BUILD_EXAMPLES=OFF
      - name: Build fuzz target
        run: cmake --build build-fuzz --target fuzz_netlist -j4
      - name: Run seed corpus (deterministic, fails on crash/UB)
        run: ./build-fuzz/power_engine/fuzz/fuzz_netlist power_engine/fuzz/corpus -max_len=1024 -runs=0
