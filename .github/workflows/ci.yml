name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.cxx }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cxx: [g++, clang++]
        build_type: [Release]
        exclude:
          # MSVC jobs use cl below instead.
          - os: windows-latest
            cxx: g++
          - os: windows-latest
            cxx: clang++
        include:
          - os: windows-latest
            cxx: cl
            build_type: Release
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DPOWER_ENGINE_BUILD_TESTS=ON
        env:
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j4
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: ubuntu / ASan+UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DPOWER_ENGINE_BUILD_TESTS=ON
          -DPOWER_ENGINE_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build-san -j4
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1

  ninja:
    name: ubuntu / Ninja generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        run: cmake -B build-ninja -G Ninja -DCMAKE_BUILD_TYPE=Release -DPOWER_ENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ninja
      - name: Test
        run: ctest --test-dir build-ninja --output-on-failure
